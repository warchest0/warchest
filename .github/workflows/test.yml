name: warchest-ci

permissions: {}

on:
  pull_request:
  push:
    branches: [staging, main]
  workflow_dispatch:

jobs:
  contracts:
    name: forge fmt / build / test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_PROFILE: ci
      ROBINHOOD_RPC_URL: https://rpc.mainnet.chain.robinhood.com
      ROBINHOOD_TESTNET_RPC_URL: https://rpc.testnet.chain.robinhood.com
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - run: forge --version
      - run: forge fmt --check
      - run: forge build --sizes
      # Fork tests read live state from the public RPC, which rate-limits CI runners (HTTP 429).
      # Throttle requests and retry with backoff instead of failing on the first refusals.
      - run: forge test -vvv --compute-units-per-second 120 --fork-retries 12 --fork-retry-backoff 3000

  indexer:
    name: indexer typecheck / test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      # the integration test deploys the real WarchestGovernance on anvil
      - run: forge build
        working-directory: contracts
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: indexer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  keeper:
    name: keeper typecheck / test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: keeper
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      # the integration tests deploy the real WarchestGovernance + WarchestVault on anvil
      - run: forge build
        working-directory: contracts
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: keeper/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # tests never touch the network: live endpoints are only exercised by `npm run smoke` (manual)
      - run: npm test

  app:
    name: frontend typecheck / lint / test / build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm --prefix web run check
        working-directory: .
      # Preview is explicitly demo-only until an audited on-chain deployment is configured.
      - run: npm run build
        env:
          NEXT_PUBLIC_DEMO: "1"
      - run: npm --prefix web run build && node scripts/build-frontend.mjs && node scripts/check-frontend.mjs
        working-directory: .
      - uses: actions/upload-artifact@v6
        with:
          name: frontend-${{ github.sha }}
          path: .vercel/output/
          include-hidden-files: true
          retention-days: 7

  docker:
    name: docker images build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: docker build -t warchest-indexer:ci indexer
      - run: docker build -t warchest-keeper:ci keeper
      - run: docker run --rm warchest-keeper:ci help

  deploy:
    name: deploy frontend to Vercel
    needs: [contracts, indexer, keeper, app, docker]
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'warchest0/warchest' &&
      (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: frontend-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ github.ref_name == 'main' && vars.VERCEL_PRODUCTION_PROJECT_ID || vars.VERCEL_STAGING_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check deployment credentials
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing VERCEL_TOKEN. Create a Vercel token and add it to repository Actions secrets."
            echo "Deployment blocked: add VERCEL_TOKEN in [Actions secrets](https://github.com/warchest0/warchest/settings/secrets/actions)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v6
        with:
          name: frontend-${{ github.sha }}
          path: .vercel/output/
      - name: Link deployment target
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          for (const key of ['VERCEL_ORG_ID', 'VERCEL_PROJECT_ID', 'VERCEL_TOKEN']) {
            if (!process.env[key]) throw new Error(`Missing ${key}`);
          }
          writeFileSync('.vercel/project.json', JSON.stringify({
            orgId: process.env.VERCEL_ORG_ID,
            projectId: process.env.VERCEL_PROJECT_ID
          }));
          JS
      - name: Deploy tested artifact
        id: deploy
        run: |
          npx --yes vercel@59.26.0 deploy --prebuilt --prod --yes --json --token "$VERCEL_TOKEN" > deployment.json
          url=$(node -e 'const d=require("./deployment.json"); const url=d.deployment?.url ?? d.url; if (!url) throw new Error("Missing deployment URL"); console.log(url.startsWith("https://") ? url : `https://${url}`);')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Frontend deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify public routes
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for route in / /docs.html /dashboard/ /vote/ /treasury/ /leaderboard/; do
            curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "$DEPLOYMENT_URL$route" -o /dev/null
          done
      - name: Point the stable production URL at this deployment
        if: github.ref_name == 'main'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          npx --yes vercel@59.26.0 alias set "$DEPLOYMENT_URL" warchest-app.vercel.app --token "$VERCEL_TOKEN"
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors https://warchest-app.vercel.app/ -o /dev/null
      - name: Show stable links
        if: always()
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "### Production release" >> "$GITHUB_STEP_SUMMARY"
            echo "[Website](https://warchest-app.vercel.app) · [Demo](https://warchest-app.vercel.app/dashboard/?preview=1)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Staging preview" >> "$GITHUB_STEP_SUMMARY"
            echo "[Website](https://warchest-staging.vercel.app) · [Demo](https://warchest-staging.vercel.app/dashboard/?preview=1)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "These stable links show the last successful deployment." >> "$GITHUB_STEP_SUMMARY"
