name: contracts-ci

permissions: {}

on:
  pull_request:
  push:
    branches: [staging, main]
  workflow_dispatch:

jobs:
  contracts:
    name: forge fmt / build / test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_PROFILE: ci
      ROBINHOOD_RPC_URL: https://rpc.mainnet.chain.robinhood.com
      ROBINHOOD_TESTNET_RPC_URL: https://rpc.testnet.chain.robinhood.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - run: forge --version
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv

  indexer:
    name: indexer typecheck / test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      # the integration test deploys the real WarchestGovernance on anvil
      - run: forge build
        working-directory: contracts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: indexer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  keeper:
    name: keeper typecheck / test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: keeper
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      # the integration tests deploy the real WarchestGovernance + WarchestVault on anvil
      - run: forge build
        working-directory: contracts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: keeper/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # tests never touch the network: live endpoints are only exercised by `npm run smoke` (manual)
      - run: npm test

  app:
    name: app typecheck / lint / test / build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # static export, demo mode (no contract addresses)
      - run: npm run build

  docker:
    name: docker images build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t warchest-indexer:ci indexer
      - run: docker build -t warchest-keeper:ci keeper
      - run: docker run --rm warchest-keeper:ci help
