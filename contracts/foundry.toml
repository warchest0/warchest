[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1_000_000
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./" }]
# The local PoolManager (compiled only for tests, via v4-core `Deployers`) exceeds EIP-170 without via_ir.
# Compile it with v4-core's own settings; production code (src/) keeps the default profile.
additional_compiler_profiles = [{ name = "v4core", via_ir = true, optimizer_runs = 44_444_444 }]
# The Across SpokePool ABI (12-parameter `deposit`) needs via_ir, exactly like the real SpokePool build; only the
# testnet mock is affected, WarchestVault itself compiles with the default pipeline.
compilation_restrictions = [
  { paths = "lib/v4-core/src/PoolManager.sol", via_ir = true, optimizer_runs = 44_444_444 },
  { paths = "src/mocks/MockAcrossSpokePool.sol", via_ir = true },
]
remappings = [
  "@uniswap/v4-core/=lib/v4-core/",
  "@uniswap/v4-periphery/=lib/v4-periphery/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/uniswap-hooks/=lib/uniswap-hooks/src/",
  "forge-std/=lib/forge-std/src/",
  "v4-core/=lib/v4-core/",
  "solmate/=lib/v4-core/lib/solmate/",
  "permit2/=lib/v4-periphery/lib/permit2/",
]

[profile.default.fuzz]
runs = 1_000

[profile.ci.fuzz]
runs = 5_000

[profile.default.invariant]
runs = 256
depth = 64

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"

[etherscan]
robinhood = { key = "blockscout", url = "https://robinhoodchain.blockscout.com/api/", chain = 4663 }

[fmt]
line_length = 120
