[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
gas_limit = "18446744073709551615"
remappings = [
  "@uniswap/v4-core/=lib/v4-core/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
